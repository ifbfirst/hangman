<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe6d9" />
    <meta name="description" content="Hangman: guess the English color from a Russian hint." />
    <title>Hangman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="is-playing">
    <div class="page">
      <header class="header">
        <p class="eyebrow">Word game</p>
        <h1>Hangman</h1>
      </header>

      <main class="board">
        <section class="stage" aria-label="Gallows">
          <svg
            class="gallows"
            viewBox="0 0 200 260"
            role="img"
            aria-labelledby="gallows-title"
          >
            <title id="gallows-title">Hangman figure</title>
            <g class="structure" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="24" y1="246" x2="118" y2="246" stroke-width="8" />
              <line x1="48" y1="246" x2="48" y2="22" stroke-width="8" />
              <line x1="48" y1="22" x2="142" y2="22" stroke-width="8" />
              <line x1="48" y1="64" x2="88" y2="22" stroke-width="6" />
            </g>
            <line
              class="rope"
              x1="142"
              y1="22"
              x2="142"
              y2="54"
              fill="none"
              stroke-width="4"
              stroke-linecap="round"
            />
            <g class="figure" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle data-part="0" cx="142" cy="74" r="20" stroke-width="5" />
              <line data-part="1" x1="142" y1="94" x2="142" y2="156" stroke-width="5" />
              <line data-part="2" x1="142" y1="112" x2="114" y2="142" stroke-width="5" />
              <line data-part="3" x1="142" y1="112" x2="170" y2="142" stroke-width="5" />
              <line data-part="4" x1="142" y1="156" x2="118" y2="204" stroke-width="5" />
              <line data-part="5" x1="142" y1="156" x2="166" y2="204" stroke-width="5" />
            </g>
          </svg>
        </section>

        <section class="playfield">
          <p class="hint" data-hint></p>
          <p class="prompt">English spelling</p>
          <div class="word" data-word aria-live="polite"></div>

          <div class="lives" aria-live="polite">
            <p class="lives__label">
              <span data-miss-count>0</span>/6 misses
            </p>
            <div class="lives__pips" data-pips aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="keyboard" data-keyboard aria-label="Letter keyboard"></div>
        </section>
      </main>
    </div>

    <div class="modal" data-modal hidden>
      <div
        class="modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="result-title"
        aria-describedby="result-word"
      >
        <p class="eyebrow" data-result-kicker></p>
        <h2 id="result-title" data-result-title></h2>
        <p id="result-word" class="modal__word" data-result-word></p>
        <button type="button" class="btn" data-action="restart">Play again</button>
      </div>
    </div>
  </body>
</html>
